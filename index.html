<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berlin Palimpsest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mono: ['"JetBrains Mono"', 'monospace'],
              sans: ['"Vazirmatn"', 'sans-serif'], // Used for Persian
            },
            colors: {
              berlin: {
                black: '#050505',
                paper: '#f0f0f0',
                neon: '#ff00ff', // Magenta
                concrete: '#808080'
              }
            },
            animation: {
              'glitch': 'glitch 1s linear infinite',
              'pulse-fast': 'pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              glitch: {
                '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                '62%': { transform: 'translate(0,0) skew(5deg)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #050505;
        color: #f0f0f0;
        overflow: hidden; /* App handles scrolling */
      }
      /* Custom scrollbar for brutalist feel */
      ::-webkit-scrollbar {
        width: 12px;
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #f0f0f0;
        border: 2px solid #050505;
      }
      .brutalist-border {
        border: 4px solid #050505;
      }
      .no-antialias {
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Leaflet overrides for brutalist look */
      .leaflet-container {
        background: #000 !important;
      }
      .leaflet-control-container .leaflet-control {
        display: none !important; /* Hide all default leaflet controls */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "leaflet": "https://esm.sh/leaflet@1.9.4"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
